name: Deploy CaptiOCR Website

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/**"
  workflow_dispatch:
  # Daily rebuild so the app versions baked into the static HTML, JSON-LD and llms.txt
  # follow new Windows/macOS releases even when the website itself does not change.
  schedule:
    - cron: "17 5 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./web

    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4
        with:
          # Full history: the sitemap uses each page's last commit date as lastmod.
          fetch-depth: 0

      - name: Setup Node.js 🟢
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Clean and install dependencies 📦
        run: |
          # Ensure clean state
          rm -rf node_modules package-lock.json
          # Fresh install with current package.json
          npm install --no-audit

      - name: Build website 🏗️
        run: |
          npm run build
        env:
          CI: false
          DISABLE_ESLINT_PLUGIN: true
          GENERATE_SOURCEMAP: false
          PUBLIC_URL: "https://www.captiocr.com"

      - name: Copy static files 📋
        run: |
          # Copy robots.txt and sitemap.xml to build directory
          cp public/robots.txt build/
          cp public/sitemap.xml build/
          # Copy CNAME if exists
          if [ -f "../CNAME" ]; then
            cp ../CNAME build/
          fi

      - name: Optimize build 🚀
        run: |
          # Remove source maps in production
          find build -name "*.map" -delete
          # List build contents for debugging
          echo "Build directory contents:"
          ls -la build/

      - name: Upload artifact 📤
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./web/build

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    
    steps:
      - name: Deploy to GitHub Pages 🚀
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Post-deploy verification ✅
        run: |
          echo "Deployment completed successfully!"
          echo "Site URL: ${{ steps.deployment.outputs.page_url }}"